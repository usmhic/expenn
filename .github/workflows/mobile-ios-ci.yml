name: CI - Mobile iOS

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ios-ci.yml"
  push:
    branches: [dev]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        env:
          EXPO_PUBLIC_API_URL: http://localhost:5000
        run: pnpm exec tsc --noEmit

  build:
    name: Build signed Ad Hoc IPA
    runs-on: macos-14
    needs: checks
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile

      - name: Set native build number
        run: node scripts/set-native-build-number.mjs "$GITHUB_RUN_NUMBER"

      - name: Prebuild native iOS project
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.DEV_API_URL || 'http://localhost:5000' }}
        run: npx expo prebuild --platform ios --no-install

      - name: Decode signing certificate and provisioning profile
        run: |
          echo "$IOS_ADHOC_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/adhoc_cert.p12"
          echo "$IOS_ADHOC_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/adhoc.mobileprovision"
        env:
          IOS_ADHOC_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_ADHOC_CERTIFICATE_P12_BASE64 }}
          IOS_ADHOC_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROVISIONING_PROFILE_BASE64 }}

      - name: Build (fastlane ios_adhoc)
        run: bundle exec fastlane ios ios_adhoc
        env:
          CI: true
          MATCH_KEYCHAIN_NAME: fastlane_tmp_keychain
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_ADHOC_CERTIFICATE_PATH: ${{ runner.temp }}/adhoc_cert.p12
          IOS_ADHOC_CERTIFICATE_PASSWORD: ${{ secrets.IOS_ADHOC_CERTIFICATE_PASSWORD }}
          IOS_ADHOC_PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/adhoc.mobileprovision
          IOS_ADHOC_PROFILE_NAME: ${{ vars.IOS_ADHOC_PROFILE_NAME }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER || 'com.expenn.traveler' }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - name: Discard local version bump
        if: always()
        run: git checkout -- app.json

      - name: Remove decoded signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/adhoc_cert.p12" "$RUNNER_TEMP/adhoc.mobileprovision"

      - uses: actions/upload-artifact@v4
        with:
          name: expenn-ios-adhoc-${{ github.run_number }}
          path: mobile/build/ExpennTraveler.ipa
          retention-days: 30
