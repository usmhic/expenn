name: CI - Web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/expenn-web

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DOTNET_API_URL: http://localhost:5000
      NEXT_PUBLIC_DOTNET_API_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm run types:check
        name: Type-check

      - run: pnpm run lint
        name: Lint

  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.expenn.com' }}
      # Set DOTNET_API_URL as a GitHub repository variable (Settings → Variables)
      # to override the default when building for staging or production.
      DOTNET_API_URL: https://api.expenn.com

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_URL=${{ env.APP_URL }}
            NEXT_PUBLIC_DOTNET_API_URL=${{ env.DOTNET_API_URL }}

  docker-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          load: true
          tags: expenn-web:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_URL=http://localhost:3000

      - name: Start container
        run: |
          docker run -d --name expenn-test -p 3000:3000 \
            expenn-web:pr-test

      - name: Wait for server
        run: |
          for i in $(seq 1 24); do
            curl -fsS http://localhost:3000/api/health && exit 0
            echo "[$i/24] waiting…"
            sleep 5
          done
          echo "Server did not become healthy in time" && exit 1

      - name: Verify health
        run: curl -fsS http://localhost:3000/api/health

      - name: Cleanup
        if: always()
        run: docker rm -f expenn-test || true
