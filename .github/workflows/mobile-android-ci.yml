name: CI - Mobile Android

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-ci.yml"
  push:
    branches: [dev]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-ci.yml"
  workflow_dispatch:

concurrency:
  group: mobile-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        env:
          EXPO_PUBLIC_API_URL: http://localhost:5000
        run: pnpm exec tsc --noEmit

  build:
    name: Build signed internal APK
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile

      - name: Set native build number
        run: node scripts/set-native-build-number.mjs "$GITHUB_RUN_NUMBER"

      - name: Prebuild native Android project
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.DEV_API_URL || 'http://localhost:5000' }}
        run: npx expo prebuild --platform android --no-install

      - name: Decode signing keystore
        run: echo "$ANDROID_INTERNAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/internal.keystore"
        env:
          ANDROID_INTERNAL_KEYSTORE_BASE64: ${{ secrets.ANDROID_INTERNAL_KEYSTORE_BASE64 }}

      - name: Build (fastlane android_internal)
        run: bundle exec fastlane android android_internal
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/internal.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_INTERNAL_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_INTERNAL_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_INTERNAL_KEY_PASSWORD }}

      - name: Discard local version bump
        if: always()
        run: git checkout -- app.json

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/internal.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: expenn-android-internal-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
