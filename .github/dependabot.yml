version: 2
updates:
  - package-ecosystem: nuget
    directory: /api
    target-branch: dev
    # Pause scheduled version PRs; security alerts/updates remain separate.
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
    groups:
      dotnet-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    target-branch: dev
    # Pause scheduled version PRs; security alerts/updates remain separate.
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
    groups:
      web-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mobile
    target-branch: dev
    # Pause scheduled version PRs; security alerts/updates remain separate.
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
    groups:
      mobile-minor:
        update-types: [minor, patch]
  - package-ecosystem: bundler
    directory: /mobile
    target-branch: dev
    # Pause scheduled version PRs; security alerts/updates remain separate.
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    # Pause scheduled version PRs; security alerts/updates remain separate.
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
